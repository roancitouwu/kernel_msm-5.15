name: "Allen UVC Kernel (Simple)"

env:
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  build:
    name: "ðŸŽ¬ Build Allen UVC"
    runs-on: ubuntu-latest
    env:
      KERNEL_DIR: common_gki
      KERNEL_NAME: common
      DEFCONFIG: gki_defconfig

    steps:
      - name: "âœ¨ Setup"
        run: |
          mkdir -p $KERNEL_DIR
          echo "BUILD_TIME=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: "ðŸ“ Setup SWAP"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: "ðŸŒŸ Clone kernel"
        working-directory: ./${{ env.KERNEL_DIR }}
        run: |
          git clone --depth=1 -b android13-5.15-lts https://android.googlesource.com/kernel/common common

      - name: "ðŸ“¥ Setup toolchains"
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          rm -rf .repo common
          
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm clang.tar.gz
          
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' $KERNEL_DIR/$KERNEL_NAME/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' $KERNEL_DIR/$KERNEL_NAME/build.config.gki || true

      - name: "ðŸŽ¬ Apply UVC Patches"
        working-directory: ./${{ env.KERNEL_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG="arch/arm64/configs/${{ env.DEFCONFIG }}"
          
          # UVC Config
          cat >> "$CONFIG" << 'EOF'
          CONFIG_LOCALVERSION="-AllenCam-UVC"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_USB_CONFIGFS_F_UVC=y
          CONFIG_USB_F_UVC=y
          CONFIG_VIDEOBUF2_CORE=y
          CONFIG_VIDEOBUF2_V4L2=y
          CONFIG_VIDEOBUF2_VMALLOC=y
          CONFIG_VIDEO_DEV=y
          CONFIG_VIDEO_V4L2=y
          CONFIG_MEDIA_SUPPORT=y
          EOF
          
          # CRITICAL: Patch f_uvc.c to allow symlink
          if [ -f "drivers/usb/gadget/function/f_uvc.c" ]; then
            sed -i 's/return -EINVAL;/return 0; \/\/ AllenCam/g' drivers/usb/gadget/function/f_uvc.c
            echo "âœ… Patched f_uvc.c"
          fi
          
          if [ -f "drivers/usb/gadget/function/uvc_configfs.c" ]; then
            sed -i 's/return -EINVAL;/return 0; \/\/ AllenCam/g' drivers/usb/gadget/function/uvc_configfs.c
            echo "âœ… Patched uvc_configfs.c"
          fi
          
          # Common patch
          curl -sL "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch" | patch -p1 --forward || true

      - name: "ðŸ”¨ Build"
        run: |
          LTO=thin BUILD_CONFIG=$KERNEL_DIR/$KERNEL_NAME/build.config.gki.aarch64 build/build.sh -j$(nproc)

      - name: "ðŸ“¦ Package"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          
          cp ../out/dist/Image ./ 2>/dev/null || cp ../out/*/dist/Image ./ 2>/dev/null || find ../out -name "Image" -type f | head -1 | xargs -I{} cp {} ./
          
          cat > anykernel.sh << 'AKSH'
          properties() { '
          kernel.string=Allen Camera Enabler UVC
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=sapphire
          device.name2=sapphiren
          device.name3=topaz
          device.name4=tapas
          supported.versions=13-16
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKSH
          
          zip -r9 "../AllenCam-UVC-${{ env.BUILD_TIME }}.zip" * -x .git README.md *placeholder

      - name: "ðŸ“¤ Upload"
        uses: actions/upload-artifact@v4
        with:
          name: AllenCam-UVC-${{ env.BUILD_TIME }}
          path: "*.zip"
